<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#344054"/>
    </marker>
  </defs>
  <rect width="980" height="640" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="bold" fill="#101828">AirIA – fluxo de uma consulta de qualidade do ar</text>

  <!-- participantes (x: app 110, servidor 330, openaq 550, gemini 730, banco 890) -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="40" y="60" width="140" height="40" rx="8" fill="#EEF7F2" stroke="#2E7D5B" stroke-width="2"/>
    <text x="110" y="85" fill="#1B5E3F">Aplicativo</text>
    <rect x="260" y="60" width="140" height="40" rx="8" fill="#EAF1FB" stroke="#1F5FA8" stroke-width="2"/>
    <text x="330" y="85" fill="#163E6E">Servidor</text>
    <rect x="480" y="60" width="140" height="40" rx="8" fill="#F4F0FB" stroke="#6B3FA0" stroke-width="2"/>
    <text x="550" y="85" fill="#4A2A73">OpenAQ</text>
    <rect x="660" y="60" width="140" height="40" rx="8" fill="#FDF0F0" stroke="#B42318" stroke-width="2"/>
    <text x="730" y="85" fill="#7A1A12">Gemini</text>
    <rect x="830" y="60" width="120" height="40" rx="8" fill="#FFF7E6" stroke="#B26B00" stroke-width="2"/>
    <text x="890" y="85" fill="#7A4100">PostgreSQL</text>
  </g>
  <g stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="110" y1="100" x2="110" y2="620"/>
    <line x1="330" y1="100" x2="330" y2="620"/>
    <line x1="550" y1="100" x2="550" y2="620"/>
    <line x1="730" y1="100" x2="730" y2="620"/>
    <line x1="890" y1="100" x2="890" y2="620"/>
  </g>

  <g font-size="12.5" fill="#101828">
    <!-- 1 -->
    <rect x="40" y="122" width="140" height="34" rx="6" fill="#F9FAFB" stroke="#D0D5DD"/>
    <text x="110" y="137" text-anchor="middle">1. permissão e GPS</text>
    <text x="110" y="151" text-anchor="middle">(lat/lon arredondadas)</text>
    <!-- 2 -->
    <line x1="110" y1="182" x2="326" y2="182" stroke="#344054" stroke-width="2" marker-end="url(#s)"/>
    <text x="218" y="175" text-anchor="middle">2. GET /air-quality + token</text>
    <!-- 3 -->
    <text x="340" y="214">3. valida o token</text>
    <!-- 4 -->
    <line x1="330" y1="244" x2="546" y2="244" stroke="#344054" stroke-width="2" marker-end="url(#s)"/>
    <text x="440" y="237" text-anchor="middle">4. estações em 25 km</text>
    <line x1="550" y1="270" x2="334" y2="270" stroke="#344054" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#s)"/>
    <text x="440" y="290" text-anchor="middle">medições recentes</text>
    <!-- 5 -->
    <text x="340" y="320">5. calcula o IQAr</text>
    <!-- 6 -->
    <line x1="330" y1="350" x2="726" y2="350" stroke="#344054" stroke-width="2" marker-end="url(#s)"/>
    <text x="528" y="343" text-anchor="middle">6. prompt com dados e perfil (se não houver cache)</text>
    <line x1="730" y1="376" x2="334" y2="376" stroke="#344054" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#s)"/>
    <text x="528" y="396" text-anchor="middle">interpretação e recomendação</text>
    <!-- 7 -->
    <line x1="330" y1="430" x2="886" y2="430" stroke="#344054" stroke-width="2" marker-end="url(#s)"/>
    <text x="610" y="423" text-anchor="middle">7. grava a medição</text>
    <!-- 8 -->
    <line x1="330" y1="468" x2="886" y2="468" stroke="#344054" stroke-width="2" marker-end="url(#s)"/>
    <text x="610" y="461" text-anchor="middle">8. avalia o alerta e grava, se for novo</text>
    <!-- 9 -->
    <line x1="330" y1="510" x2="114" y2="510" stroke="#344054" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#s)"/>
    <text x="222" y="503" text-anchor="middle">9. JSON: índice, textos, alerta</text>
    <!-- 10 -->
    <rect x="40" y="540" width="140" height="48" rx="6" fill="#F9FAFB" stroke="#D0D5DD"/>
    <text x="110" y="560" text-anchor="middle">10. exibe o resultado</text>
    <text x="110" y="577" text-anchor="middle">e o aviso, se novo</text>
  </g>
</svg>
